services:
  - type: web
    name: tistory-auto-publisher
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    dockerCommand: "uvicorn app:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: KAKAO_EMAIL
        sync: false
      - key: KAKAO_PASSWORD
        sync: false
