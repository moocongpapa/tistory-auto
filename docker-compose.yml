version: '3.8'

services:
  tistory-publisher:
    build: .
    container_name: tistory-auto-publisher
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./session_data:/app/session_data
      - ./generated:/app/generated
      - ./config:/app/config
